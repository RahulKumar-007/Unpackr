  <!-- Dynamic Upward Extraction & Reclamation Arrow -->
  <path d="M64 22 L76 36 L68 36 L68 62 L60 62 L60 36 L52 36 Z" fill="url(#accentGrad)"/>

  <!-- Emerald Storage Saved Spark -->
