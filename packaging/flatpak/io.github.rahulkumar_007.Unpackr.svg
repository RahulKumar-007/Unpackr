<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#boxGrad)" stroke="#384458" stroke-width="2"/>

  <!-- Archive Box Body -->
  <path d="M28 54 L64 36 L100 54 L64 72 Z" fill="url(#lidGrad)" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M28 54 L28 88 L64 104 L64 72 Z" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>
  <path d="M100 54 L100 88 L64 104 L64 72 Z" fill="#0f172a" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>

  <!-- Zip Teeth down the center seam -->
