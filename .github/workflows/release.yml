name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: default
            artifact_name: unpackr
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: headless
            artifact_name: unpackr-cli
          - os: macos-13
            target: x86_64-apple-darwin
            features: default
            artifact_name: unpackr
          - os: macos-14
            target: aarch64-apple-darwin
            features: default
            artifact_name: unpackr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux GUI)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'default'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.features }}" = "headless" ]; then
            cargo build --release --target ${{ matrix.target }} --no-default-features --features bench
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package archive
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="${{ matrix.artifact_name }}-${TAG}-${{ matrix.target }}"
          STAGE_DIR="/tmp/${ARCHIVE_NAME}"
          mkdir -p "${STAGE_DIR}"

          BIN_PATH="target/${{ matrix.target }}/release/unpackr"
          cp "${BIN_PATH}" "${STAGE_DIR}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGE_DIR}/"

          tar -czvf "${ARCHIVE_NAME}.tar.gz" -C "/tmp" "${ARCHIVE_NAME}"
          mkdir -p dist
          mv "${ARCHIVE_NAME}.tar.gz" dist/

      - name: Build Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          chmod +x packaging/build_deb.sh
          BIN_SOURCE="target/${{ matrix.target }}/release/unpackr" VERSION="${VERSION}" ./packaging/build_deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact_name }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          mkdir -p release-assets
          cp all-dist/*.tar.gz all-dist/*.deb release-assets/ 2>/dev/null || cp all-dist/* release-assets/
          cd release-assets
          sha256sum *.tar.gz *.deb > SHA256SUMS.txt 2>/dev/null || sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
