[package]
name = "unpackr"
version = "0.1.0"
edition = "2021"
authors = ["Unpackr Authors"]
description = "A production-quality, low-disk-space archive extraction engine"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"
blake3 = "1.5"
walkdir = "2.5"
tempfile = "3.10"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
clap_complete = "4.5"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_bench"
harness = false
