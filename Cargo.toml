[package]
name = "unpackr"
version = "0.1.0"
edition = "2021"
authors = ["Unpackr Authors"]
description = "A production-quality, low-disk-space archive extraction engine"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"
blake3 = "1.5"
walkdir = "2.5"
tempfile = "3.10"
zip = { version = "2.1", default-features = false, features = ["deflate"], optional = true }
clap_complete = "4.5"
eframe = { version = "0.27.2", optional = true }
rfd = { version = "0.15.4", optional = true }

[dev-dependencies]
criterion = "0.5"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[features]
default = ["bench", "gui"]
bench = ["dep:zip"]
gui = ["dep:eframe", "dep:rfd"]

[[bench]]
name = "engine_bench"
harness = false
