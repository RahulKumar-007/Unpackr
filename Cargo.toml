[package]
name = "unpackr"
version = "0.1.0"
edition = "2021"
authors = ["Rahul Kumar <chhonkarrahul1362@gmail.com>"]
description = "Production-quality, low-disk-space archive extraction engine with progressive in-place storage reclamation and native GUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RahulKumar-007/Unpackr"
homepage = "https://github.com/RahulKumar-007/Unpackr"
documentation = "https://docs.rs/unpackr"
readme = "README.md"
keywords = ["zip", "archive", "extraction", "fallocate", "storage"]
categories = ["command-line-utilities", "compression", "filesystem", "gui"]
exclude = [
    "tests/test_data/*",
    ".github/*",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }"
pkg-fmt = "tgz"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/unpackr", dest = "/usr/bin/unpackr", mode = "755" },
    { source = "extra/unpackr.desktop", dest = "/usr/share/applications/unpackr.desktop", mode = "644" },
    { source = "extra/unpackr.svg", dest = "/usr/share/icons/hicolor/scalable/apps/unpackr.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/unpackr/README.md", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/unpackr/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/unpackr/LICENSE-APACHE", mode = "644" },
    { source = "target/completions/unpackr", dest = "/usr/share/bash-completion/completions/unpackr", mode = "644" },
    { source = "target/completions/_unpackr", dest = "/usr/share/zsh/site-functions/_unpackr", mode = "644" },
    { source = "target/completions/unpackr.fish", dest = "/usr/share/fish/vendor_completions.d/unpackr.fish", mode = "644" },
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
libc = "0.2"
blake3 = "1.5"
walkdir = "2.5"
tempfile = "3.10"
zip = { version = "2.1", default-features = false, features = ["deflate"], optional = true }
clap_complete = "4.5"
eframe = { version = "0.27.2", optional = true }
rfd = { version = "0.15.4", optional = true }

[dev-dependencies]
criterion = "0.5"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

[features]
default = ["bench", "gui"]
bench = ["dep:zip"]
gui = ["dep:eframe", "dep:rfd"]

[[bench]]
name = "engine_bench"
harness = false
